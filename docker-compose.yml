# docker-compose — описание того, как два контейнера живут вместе.
#
# Поднять всё одной командой:   docker compose up -d --build
# Посмотреть логи:              docker compose logs -f
# Остановить:                   docker compose down
#
# Флаг -d (detach) — запуск в фоне, без привязки к терминалу.

services:
  # Flask API + SQLite
  backend:
    build: ./backend
    environment:
      # База кладём в каталог /data, который примонтирован из тома (см. volumes)
      DATABASE_FILE: /data/calculator.db
    volumes:
      # Именованный том: данные переживут удаление и пересоздание контейнера.
      # Удалить историю целиком можно только явно: docker volume rm
      - dbdata:/data
    # Порт наружу НЕ публикуем: до бэкенда можно достаться только изнутри
    # Docker-сети (через nginx). Это осознанное решение по безопасности.

  # nginx: раздаёт React-статикой и проксирует /api на backend
  frontend:
    build: ./frontend
    ports:
      - "80:80"        # порт сервера → порт контейнера
    depends_on:
      - backend        # при `up` бэкенд поднимется первым

volumes:
  dbdata:
