# Конфигурация nginx внутри контейнера фронтенда.
#
# Две задачи:
#   1. Отдавать собранные файлы React (index.html, JS, CSS)
#   2. Пересылать запросы /api/* на контейнер бэкенда
#
# Пункт 2 решает проблему CORS в продакшене: для браузера всё приходит
# с одного адреса, никакого «чужого сервера» нет.
# «backend» — это имя сервиса из docker-compose.yml; Docker сам
# превращает его во внутренний IP нужного контейнера.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Все запросы к API отправляем Flask-контейнеру
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # React — приложение с одним сайтом на всё (SPA).
    # Если пользователь открыл /что-то-не-то, отдаём index.html,
    # и разбираться дальше будет сам React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
